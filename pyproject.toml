[project]
name = "aml-insight"
version = "0.1.0"
description = "Evidence-backed AML investigation and evaluated improvement proposals"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "firebase-admin>=6,<8",
  "google-cloud-firestore>=2.20,<3",
  "google-cloud-tasks>=2.19,<3",
  "google-genai>=1,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
